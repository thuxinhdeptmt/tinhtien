<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tính tiền</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <div class="eyebrow">BILL SPLITTER</div>
        <h1>Tính tiền</h1>
      </div>
      <button id="resetBtn" class="ghost-btn" type="button">Xóa dữ liệu</button>
    </header>

    <section class="workspace" aria-label="Khu vực tính tiền">
      <div id="peopleGrid" class="people-grid" aria-label="Các khoản đã chi"></div>

      <aside class="result-panel" aria-label="Kết quả thanh toán">
        <button id="resultTitleBtn" class="result-title-btn" type="button" aria-expanded="false">
          <span>Kết quả</span>
          <span class="result-title-caret">⌄</span>
        </button>

        <div class="matrix-wrap">
          <table id="resultMatrix" class="result-matrix">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="detailPanel" class="detail-panel is-hidden"></div>
      </aside>
    </section>
  </main>

  <template id="personTemplate">
    <article class="person-panel">
      <div class="person-head">
        <h2 class="person-title"></h2>
      </div>
      <div class="active-groups"></div>
      <div class="type-adder-wrap">
        <button class="add-type-btn" type="button">＋ Thêm loại khoản...</button>
        <div class="type-menu" hidden></div>
      </div>
    </article>
  </template>

  <template id="groupTemplate">
    <section class="expense-group">
      <div class="group-topline">
        <h3 class="group-title"></h3>
        <div class="group-summary" aria-label="Tổng hợp nhóm">
          <span class="summary-main"></span>
          <span class="summary-sub"></span>
        </div>
      </div>
      <div class="expense-rows"></div>
      <button class="add-expense-btn" type="button">＋ Thêm khoản...</button>
    </section>
  </template>

  <script src="script.js"></script>
</body>
</html>
